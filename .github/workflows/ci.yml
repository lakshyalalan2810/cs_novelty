name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safe-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q project/src project/scripts project/tests
      - name: Check frozen scope and context consistency
        run: python -m unittest discover -s project/tests -p 'test_context_consistency.py' -v
